[project]
name = "praesidium-python"
version = "0.1.0"
description = "Praesidium 自动化运维与 AI 分析服务"
readme = "README.md"
authors = [
    { name = "suyala", email = "2992790671@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ansible-runner>=2.4.3",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
praesidium-python = "praesidium_python.main:run"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
